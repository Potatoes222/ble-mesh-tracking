#
# CHUA tat trong ban dau: uu tien co 1 ban CHAY DUOC + do duoc dong truoc da,
# roi moi tat tung cai mot VA DO LAI de xac nhan tung buoc. (Bai hoc tu ban
# XIAO: tung tuong disable SPI2 lam treo board, mat nhieu gio debug, hoa ra
# thu pham that la flash nham file app CHUA KY — nen tu gio doi config nao
# cung phai do/xac minh rieng, khong doi nhieu thu cung luc.)
#
# Luu y khi lam: pwm0 dang duoc node "pwmleds" (red_pwm_led) tham chieu, tat
# pwm0 ma khong xu ly node do se gay loi build.

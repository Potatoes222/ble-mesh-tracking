CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="Test beacon"

# =====================================================================
# [POWER] TAT USB + CONSOLE + LOG — khoan tiet kiem LON NHAT (~0.7mA)
# =====================================================================
#
# Board lay USB CDC-ACM lam console (khong co UART debug rieng), nen chi can
# CONFIG_CONSOLE=y la ca tang USB device stack bi keo vao va CHAY MAI MAI:
# CONFIG_USB_DEVICE_STACK_NEXT + CONFIG_UDC_NRF. Va vi CONFIG_PM_DEVICE khong
# bat, khong ai suspend chung -> ton dien lien tuc KE CA KHI DA RUT DAY USB.
#
# So lieu DO THAT tren board nay (pin, da rut USB, dong ho DT-9205A thang 200mA):
#   Firmware day du (co USB/log)          1.7 mA
#   Firmware TRONG (khong USB/log/BLE)    1.0 mA   <- chenh 0.7mA la cua USB
#   Firmware trong + P0.13 LOW            0.9 mA   <- san PHAN CUNG, bo tay
#
# LUU Y KHI DEBUG: tat cai nay di la MAT COM port + mat log. Khi can xem log,
# build kem debug.conf de bat lai (xem README muc Build).
#
# Ban than viec tat log (CONFIG_LOG=n) DA THU RIENG va KHONG an thua gi — vi
# no chi chan viec IN RA, tang USB van duoc khoi tao va chay. Phai tat console
# thi USB moi thuc su bi go ra khoi build.
# DAY LA CONG TAC DUNG (mot dong, thay cho viec tat le te tung symbol).
# Xem zephyr/boards/common/usb/Kconfig.cdc_acm_serial.defconfig: toan bo khoi
#     if BOARD_SERIAL_BACKEND_CDC_ACM
#         config SERIAL                          default y
#         config CONSOLE                         default y
#         config USB_DEVICE_STACK_NEXT           default y if !MCUBOOT
#         config CDC_ACM_SERIAL_INITIALIZE_AT_BOOT  default y if !MCUBOOT
# nam duoi cong tac nay -> tat no la ca cum tu rung theo.
#
# (Da thu cach tat le te CONFIG_CONSOLE/UART_CONSOLE/SERIAL/LOG=n truoc do:
#  KHONG an — .config van con USB_DEVICE_STACK_NEXT=y va UDC_NRF=y, va build
#  con loi "'__device_dts_ord_106' undeclared" vi cdc_acm_serial.c van duoc
#  compile trong khi node usbd da bi tat o devicetree.)
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_LOG=n

# [POWER] Tat cong tac mem cap nguon ra chan VCC ngoai (P0.13) — tiet kiem
# 0.1mA. Can GPIO driver. Xem src/main.c + overlay de biet chi tiet + so do.
CONFIG_GPIO=y

# PSA Crypto (HMAC-SHA256) cho epoch key rotation cua bmt_auth
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y

# [POWER] Ha TX power radio tu mac dinh 0dBm -> -4dBm (giong ban XIAO).
CONFIG_BT_CTLR_TX_PWR_MINUS_4=y

# [POWER] Doc pin qua VDDHDIV5 noi bo — xem bmt_battery.c + overlay.
CONFIG_ADC=y

# =====================================================================
# [POWER] KHAC BIET QUAN TRONG SO VOI BAN XIAO — DC/DC regulator
# =====================================================================
#
# nRF52840 co HAI bo DC/DC rieng biet, cho 2 kien truc nguon khac nhau:
#
#  - REG1 ("normal voltage"): dung khi chan VDD duoc cap tu LDO ngoai da ha
#    ap san. Day la truong hop XIAO (pin -> BQ25101 -> LDO SGM2040 3.3V).
#    Board XIAO co cuon cam L3 10uH giua DCC/DEC4, va devicetree cua board
#    XIAO TU BAT san ca hai:
#         &reg0 { status = "okay"; };
#         &reg1 { regulator-initial-mode = <NRF5X_REG_MODE_DCDC>; };
#
#  - REG0 ("high voltage"): dung khi pin noi THANG vao chan VDDH — chinh la
#    kien truc cua ProMicro/nice!nano v2.
#
# Board ProMicro trong Zephyr KHONG cau hinh reg0/reg1 gi ca -> ca hai deu o
# mac dinh (REG1 chay che do LDO, khong phai DCDC).
#
# LUU Y: 2 symbol Kconfig cu (CONFIG_SOC_DCDC_NRF52X / _HV) da bi DEPRECATED
# trong Zephyr nay — bat DCDC gio phai lam qua DEVICETREE nhu vi du tren,
# khong phai qua prj.conf. (Symbol "CONFIG_BOARD_ENABLE_DCDC_HV" ma cac
# huong dan ZMK hay nhac la cua RIENG ZMK, khong ton tai o Zephyr upstream.)
#
# CHUA BAT DCDC o ban dau — CO CHU DICH:
#   1) Chua xac minh duoc board clone nay co du cuon cam cho DCDC hay khong.
#   2) So lieu thuc do tu cong dong ZMK (issue zmkfirmware/zmk#2990) cho thay
#      bat DC/DC che do HV tren board loai nay co the LAM TANG dong:
#         - nice!nano CHINH HANG: +0.12-0.48 mA standby (tang 20-25%)
#         - board CLONE: +1.30-1.32 mA (!!)
#      Nghi ngo do clone cat bo cuon cam -> bo chuyen mach chay sai, ton hon
#      ca de LDO.
#
# => KE HOACH: do dong o cau hinh mac dinh TRUOC, roi moi thu bat DCDC qua
#    devicetree VA DO LAI de so sanh. Chi giu neu so do that su tot hon.


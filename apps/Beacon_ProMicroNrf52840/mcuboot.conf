# [SECURITY] MCUboot tren XIAO nRF52840 dung USB CDC-ACM lam console mac dinh
# (board khong co UART debug rieng), nhung MCUboot KHONG bat USB stack (bootloader
# toi gian, khong can). Ket qua: console driver bi thieu link -> "undefined
# reference to __device_dts_ord_N". MCUboot khong can in log gi ca (chi verify
# chu ky + nhay sang slot0_partition) nen tat han console la cach don gian nhat,
# dong thoi giam attack surface (khong lo thong tin version/debug qua serial).
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=n

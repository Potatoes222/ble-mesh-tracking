CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="Test beacon"

# PSA Crypto (HMAC-SHA256) cho epoch key rotation cua bmt_auth
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y

# [POWER] Ha TX power radio tu mac dinh 0dBm -> -4dBm. Giam dong tieu thu
# luc TX (cung giam bien do xung dong qua diode/tu, xem bmt_battery.c va
# hoi thoai ve sut ap CR2032), doi lai tam phat giam nhe — can test lai
# khoang cach thuc te sau khi flash.
CONFIG_BT_CTLR_TX_PWR_MINUS_4=y

# [POWER] Doc pin qua kenh SAADC noi (VDD) — xem bmt_battery.c
CONFIG_ADC=y

# =====================================================================
# [POWER] TAT USB + CONSOLE + LOG — khoan tiet kiem LON NHAT (~0.7-0.8mA)
# =====================================================================
#
# Lan dau tung thu tat USB tren board nay bang cach tat le te tung symbol
# (CONFIG_CONSOLE/UART_CONSOLE/SERIAL=n rieng le) va bi loi build "undefined
# reference __device_dts_ord_125" trong log_backend_uart.c — vi CONFIG_LOG
# van con y, log backend van duoc compile nhung thiet bi UART da bi go khoi
# devicetree. Da GIU NGUYEN (khong tat) trong 1 thoi gian vi ly do do.
#
# Sau khi ben ProMicro do dac va xac nhan cong tac dung (xem prj.conf cua
# Beacon_ProMicroNrf52840, ~0.7mA tren tong ~1.9mA), ap dung lai y het o day:
# phai tat CA HAI CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM va CONFIG_LOG CUNG LUC
# (khong tach le), vi CONFIG_LOG=n moi la thu loai log_backend_uart.c ra khoi
# build, tranh dung lai loi undefined reference nhu lan truoc.
#
# LUU Y KHI DEBUG: tat cai nay di la MAT COM port + mat log. Khi can xem log,
# build kem debug.conf de bat lai (xem README muc Build).
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_LOG=n

# [POWER] HUONG A (advertising lien tuc, low-power):
#  - CPU tu ngu (System ON idle) giua cac lan phat: Zephyr idle thread lam san,
#    khong can config.
#  - DC/DC regulator: DA BAT SAN qua devicetree board (reg1 = DCDC mode);
#    soc.c cua nRF52 doc thuoc tinh do va goi nrf_power_dcdcen_set(true) luc
#    boot -> KHONG can them config gi. (Da kiem tra soc/nordic/nrf52/soc.c.)
#  - Interval 1s (bmt_config.h) + TX -4dBm da set.
# => Huong A gan nhu da toi uu san; do dong thuc te can Power Profiler (PPK2).

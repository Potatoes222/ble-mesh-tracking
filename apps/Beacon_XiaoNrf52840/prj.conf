CONFIG_BT=y
CONFIG_LOG=y
CONFIG_BT_DEVICE_NAME="Test beacon"

# PSA Crypto (HMAC-SHA256) cho epoch key rotation cua bmt_auth
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y

# [POWER] Ha TX power radio tu mac dinh 0dBm -> -4dBm. Giam dong tieu thu
# luc TX (cung giam bien do xung dong qua diode/tu, xem bmt_battery.c va
# hoi thoai ve sut ap CR2032), doi lai tam phat giam nhe — can test lai
# khoang cach thuc te sau khi flash.
CONFIG_BT_CTLR_TX_PWR_MINUS_4=y

# [POWER] Doc pin qua kenh SAADC noi (VDD) — xem bmt_battery.c
CONFIG_ADC=y

# [POWER] [DA THU TAT, KHONG DUOC] USB device stack (CDC-ACM) tuong nhu
# thua vi khong thay code nao goi USB, nhung hoa ra day chinh la duong
# console/log (chosen zephyr,console tro toi board_cdc_acm_uart) — tat di
# la mat het kha nang xem log qua com port (build LOI: undefined reference
# __device_dts_ord_125 trong log_backend_uart.c). GIU NGUYEN, khong tat.
# Neu that su can tat sau nay (production, khong con can debug qua com port
# nua) thi phai doi ca chosen console sang mot backend khac (RTT hoac tat
# log hoan toan) TRUOC, khong the tat rieng USB nhu the nay.

# [POWER] HUONG A (advertising lien tuc, low-power):
#  - CPU tu ngu (System ON idle) giua cac lan phat: Zephyr idle thread lam san,
#    khong can config.
#  - DC/DC regulator: DA BAT SAN qua devicetree board (reg1 = DCDC mode);
#    soc.c cua nRF52 doc thuoc tinh do va goi nrf_power_dcdcen_set(true) luc
#    boot -> KHONG can them config gi. (Da kiem tra soc/nordic/nrf52/soc.c.)
#  - Interval 1s (bmt_config.h) + TX -4dBm da set.
# => Huong A gan nhu da toi uu san; do dong thuc te can Power Profiler (PPK2).

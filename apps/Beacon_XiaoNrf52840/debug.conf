# =====================================================================
# BAN DEBUG — bat lai console/log qua USB CDC-ACM
# =====================================================================
#
# prj.conf (ban chay that) da TAT USB+console+log vi chung ton ~0.7-0.8mA
# lien tuc ke ca khi da rut day USB — xem giai thich day du trong prj.conf.
#
# File nay bat lai de con xem duoc log khi can debug. DUNG DUNG DE DO DONG:
# so do se cao hon ban that ~0.7-0.8mA.
#
# Cach build:
#   west build -b xiao_ble/nrf52840 -d build_debug . --pristine \
#       -- "-DBeacon_XiaoNrf52840_EXTRA_CONF_FILE=debug.conf"
#
# (Phai co tien to ten app "Beacon_XiaoNrf52840_" vi day la build nhieu
#  image kieu sysbuild — thieu tien to se bao loi CMake configure.)

# Bat lai cong tac ma prj.conf da tat. Cai nay keo theo ca cum:
# SERIAL, CONSOLE, UART_CONSOLE, USB_DEVICE_STACK_NEXT,
# CDC_ACM_SERIAL_INITIALIZE_AT_BOOT (xem prj.conf de biet chi tiet).
#
# LUU Y: chi dat CONFIG_CONSOLE=y/SERIAL=y ma quen dong nay thi VO DUNG —
# console bat len nhung khong co thiet bi UART nao de xuat ra -> van khong
# co COM port. (Da dinh loi nay 1 lan ben ProMicro.)
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=y
CONFIG_LOG=y

# [FIX] "udc: Failed to allocate net_buf N, ep 0x80" lap lai lien tuc trong
# log — pool buffer USB mac dinh cua Zephyr qua nho (CONFIG_UDC_BUF_POOL_SIZE
# default = 1024 byte, CONFIG_UDC_BUF_COUNT default = 16), khong du cho ca
# giao dich USB control lan du lieu log CDC-ACM cung luc, dac biet ngay sau
# su kien SUSPEND/RESUME. Tang len de du cho ca 2. Xem dinh nghia Kconfig tai
# zephyr/drivers/usb/udc/Kconfig. Chi ton them ~3KB RAM (khong dang ke, con
# du 256KB RAM cua nRF52840).
CONFIG_UDC_BUF_POOL_SIZE=4096
CONFIG_UDC_BUF_COUNT=32

# [SECURITY] MCUboot — tuong duong Secure Boot V2 ben ESP32 Tag.
# Single-slot mode: MCUboot chi verify chu ky + boot slot0_partition, chua
# ho tro OTA qua BLE (update = re-flash UF2 toan bo qua Adafruit bootloader
# co san, xem boards/xiao_ble_nrf52840.overlay de biet ly do layout nay).
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_SINGLE_APP=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="G:/Thesis/mcuboot_keys/bmt_tag_ecdsa_p256.pem"
